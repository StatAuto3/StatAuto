syntax = "proto3";

package courses;

import "google/protobuf/timestamp.proto";

service CoursesService {
  rpc GetCourses(GetCoursesRequest) returns (GetCoursesResponse);
  rpc GetCourseById(GetCourseByIdRequest) returns (GetCourseByIdResponse);
  rpc CreateCourse(CreateCourseRequest) returns (CreateCourseResponse);
  rpc UpdateCourse(UpdateCourseRequest) returns (UpdateCourseResponse);
  rpc DeleteCourse(DeleteCourseRequest) returns (DeleteCourseResponse);
  rpc GetCourseResults(GetCourseResultsRequest) returns (GetCourseResultsResponse);
}

// Types simplifiés pour éviter les problèmes d'imports
message Course {
  string id = 1;
  string name = 2;
  string image = 3;
  google.protobuf.Timestamp date = 4;
  int32 nb_tours = 5;
}

message Participation {
  string id = 1;
  string piloteId = 2;
  string courseId = 3;
  int32 chrono = 4;
  int32 position = 5;
  int32 points = 6;
  google.protobuf.Timestamp createdAt = 7;
  google.protobuf.Timestamp updatedAt = 8;
}

message GetCoursesRequest {
  string query = 1;
  int32 limit = 2;
  int32 offset = 3;
  string sort_by = 4;
  string sort_order = 5;
  google.protobuf.Timestamp date_from = 6;
  google.protobuf.Timestamp date_to = 7;
}

message GetCoursesResponse {
  repeated Course courses = 1;
  int32 total = 2;
}

message GetCourseByIdRequest {
  string id = 1;
}

message GetCourseByIdResponse {
  Course course = 1;
}

message CreateCourseRequest {
  string name = 1;
  string image = 2;
  google.protobuf.Timestamp date = 3;
  int32 nb_tours = 4;
}

message CreateCourseResponse {
  Course course = 1;
  string message = 2;
}

message UpdateCourseRequest {
  string id = 1;
  string name = 2;
  string image = 3;
  google.protobuf.Timestamp date = 4;
  int32 nb_tours = 5;
}

message UpdateCourseResponse {
  Course course = 1;
  string message = 2;
}

message DeleteCourseRequest {
  string id = 1;
}

message DeleteCourseResponse {
  bool success = 1;
  string message = 2;
}

message GetCourseResultsRequest {
  string course_id = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message GetCourseResultsResponse {
  repeated Participation results = 1;
  int32 total_participants = 2;
}