syntax = "proto3";

package stable_type;
import "types/pilote.type.proto";

message StableType {
  string id = 1;
  string name = 2;
  string location = 3;
  optional string image = 4;
  optional string image_cover = 5;
  int32 pilotes = 6;
  int32 how_many_tournaments = 7;
  int32 how_many_wins = 8;
  int32 how_many_losses = 9;
  optional int32 total_points = 10;
  repeated pilote_type.PiloteType pilote = 11;
}